<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Umbra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Umbra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000000;
  --glass:rgba(12,6,8,.64);
  --glass-2:rgba(32,12,16,.55);
  --line:rgba(255,232,232,.08);
  --line-2:rgba(255,232,232,.15);
  --blood:#7a0e18;
  --ember:#c42330;
  --wine:#2c060b;
  --bone:#efe8e7;
  --ash:#a69a9c;
  --dim:#685c5f;
  --ok:#6fb393;
  --warn:#d8a24c;
  --f-dot:"Doto","JetBrains Mono",ui-monospace,monospace;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
  /* layout: one floating macOS-style glass window over a living field of dark-red dots; the dock is the navigation */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--void);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

/* menu bar */
.menubar{flex:none;height:30px;display:flex;align-items:center;gap:16px;padding:0 max(12px,env(safe-area-inset-left));background:rgba(6,3,4,.6);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
.sigil{width:15px;height:15px;display:block}
.brand{font-weight:700;letter-spacing:.01em}
.mi{color:var(--ash);border:0;background:none;padding:0;font-size:13px}
.mi.on{color:var(--bone)}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:11px;font-family:var(--f-mono);font-size:10.5px;color:var(--ash);letter-spacing:.06em}
.st{display:flex;align-items:center;gap:5px}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--dim);display:block}
.sdot.on{background:var(--ember);box-shadow:0 0 8px rgba(196,35,48,.9)}
.sdot.half{background:var(--warn)}
.gear{border:0;background:none;padding:4px;display:grid;place-items:center;color:var(--ash)}
.gear svg{width:15px;height:15px}
@media (max-width:460px){.mi{display:none}.mi.on{display:inline}}

/* window */
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:10px 10px calc(86px + env(safe-area-inset-bottom))}
.window{width:100%;max-width:540px;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:0 30px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.titlebar{flex:none;height:38px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.lights{display:flex;gap:8px;position:relative;z-index:1}
.lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.4)}
.lights i:nth-child(1){background:#c42330}
.lights i:nth-child(2){background:#7d1620}
.lights i:nth-child(3){background:#45101a}
.lights i[role=button]{cursor:pointer}
.ttl{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:11.5px;color:var(--ash);letter-spacing:.05em;pointer-events:none}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 30px;overscroll-behavior:contain}
.view > * + *{margin-top:16px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:7px;padding:8px 10px 10px;background:rgba(24,10,13,.5);border:1px solid var(--line-2);border-radius:22px;backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);box-shadow:0 18px 50px rgba(0,0,0,.6)}
.dock button{width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(160deg,#311318 0%,#13070a 70%);display:grid;place-items:center;position:relative;transition:transform .22s cubic-bezier(.3,1.7,.5,1)}
.dock button:active{transform:translateY(-9px) scale(1.14)}
.dock button.on::after{content:"";position:absolute;bottom:-7px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--bone)}
.dock svg{width:26px;height:26px;fill:none;stroke:var(--bone);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock .lbl{position:absolute;bottom:-1px;font-size:0}
.bounce{animation:bounce 1s cubic-bezier(.3,0,.3,1) 2}
@keyframes bounce{0%,100%{transform:none}30%{transform:translateY(-16px)}55%{transform:none}75%{transform:translateY(-6px)}}

/* type */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);margin:0}
.dot-h{font-family:var(--f-dot);font-weight:900;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1.dot-h{font-size:clamp(30px,9vw,40px)}
h2.dot-h{font-size:24px}
h3{font-size:16px;margin:0;font-weight:650;text-wrap:balance}
p{margin:0}
.muted{color:var(--ash)}
.small{font-size:13px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.stack > * + *{margin-top:10px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* surfaces */
.card{background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.hot{border-color:rgba(196,35,48,.5);box-shadow:0 0 30px rgba(196,35,48,.1)}
.btn{appearance:none;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--bone);border-radius:10px;padding:10px 14px;font:600 14px var(--f-body);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.red{background:linear-gradient(180deg,#a61a27,#650b14);border-color:#c42330}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45}
.btn.full{width:100%}
.seg{display:flex;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ash);font:600 13px var(--f-body);padding:8px 4px;border-radius:7px;min-height:38px}
.seg button.on{background:rgba(196,35,48,.24);color:var(--bone);box-shadow:inset 0 0 0 1px rgba(196,35,48,.55)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--ash);border-radius:999px;padding:7px 13px;font:600 12.5px var(--f-body);min-height:34px}
.chip.on{color:var(--bone);border-color:rgba(196,35,48,.7);background:rgba(196,35,48,.18)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--ash)}
.pill.red{border-color:rgba(196,35,48,.6);color:#f0a2a8}
.pill.ok{border-color:rgba(111,179,147,.5);color:var(--ok)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw{width:46px;height:28px;border-radius:999px;border:1px solid var(--line-2);background:rgba(0,0,0,.4);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .2s}
.sw[aria-checked=true]{background:rgba(196,35,48,.35);border-color:rgba(196,35,48,.7)}
.sw[aria-checked=true]::after{transform:translateX(18px);background:var(--bone)}
textarea,input[type=text],select{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--line-2);color:var(--bone);border-radius:10px;padding:11px 12px;font:15px/1.45 var(--f-body)}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ember)}
label.lab{display:block;font-size:12.5px;color:var(--ash);margin-bottom:6px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.list{display:flex;flex-direction:column;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}

/* transit */
.orb{position:relative;display:grid;place-items:center;width:min(60vw,220px);aspect-ratio:1;margin:22px auto 10px;border-radius:50%;border:0;color:var(--bone);background:radial-gradient(circle at 50% 40%,#6a0d18 0%,#2a050b 46%,#0a0203 74%);box-shadow:0 0 0 1px rgba(196,35,48,.4),0 0 70px rgba(196,35,48,.28),inset 0 0 50px rgba(0,0,0,.85)}
.orb::before,.orb::after{content:"";position:absolute;inset:-11px;border-radius:50%;border:1px dashed rgba(196,35,48,.4);animation:spin 46s linear infinite;pointer-events:none}
.orb::after{inset:-24px;border-style:dotted;border-width:2px;border-color:rgba(196,35,48,.22);animation-duration:80s;animation-direction:reverse}
.orb:active{transform:scale(.97)}
.orb .o-l{font-family:var(--f-dot);font-weight:900;font-size:36px;letter-spacing:.06em;line-height:1}
.orb .o-s{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:#d9a7ab;margin-top:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.next-list{display:flex;flex-direction:column;gap:2px}
.next-list .kv b{font-weight:600}

/* path */
.track{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;color:var(--ember);text-transform:uppercase;margin:22px 0 8px}
.mod{display:grid;grid-template-columns:46px 1fr 42px;gap:12px;align-items:center;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:left}
.mod + .mod{margin-top:8px}
.mod .n{font-family:var(--f-dot);font-weight:900;font-size:28px;color:var(--ember);line-height:1}
.mod .t{font-weight:650;font-size:15px;display:block}
.mod .s{display:block;font-size:12.5px;color:var(--ash);line-height:1.35;margin-top:2px}
.mod.next{border-color:rgba(196,35,48,.6);box-shadow:0 0 26px rgba(196,35,48,.14)}
.ring{width:40px;height:40px;display:block}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:var(--ember);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{font:700 10px var(--f-mono);fill:var(--bone)}
.script{font-size:15.5px;line-height:1.62;color:#e6dcdb}
.script p + p{margin-top:12px}
.concept{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.concept dt{font-weight:650;color:var(--bone)}
.concept dd{margin:0;color:var(--ash)}
.vid{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);text-decoration:none}
.vid + .vid{margin-top:6px}
.vid .vn{font-family:var(--f-dot);font-weight:900;font-size:18px;color:var(--ember)}
.vid .vt{font-size:14px;font-weight:600;line-height:1.3;display:block}
.vid .vw{font-size:12px;color:var(--ash);display:block}
.vid.seen{opacity:.6}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6d0c15,var(--ember));border-radius:3px}

/* ambrose */
.presence{display:flex;gap:14px;align-items:center}
.eye{width:58px;height:58px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 50%,#000 0 18%,#7a0e18 19% 34%,#1a0407 35% 70%,#000 71%);box-shadow:0 0 0 1px rgba(196,35,48,.45),0 0 30px rgba(196,35,48,.3)}
.eye.talking{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(196,35,48,.8),0 0 46px rgba(196,35,48,.6)}}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:rgba(196,35,48,.2);border:1px solid rgba(196,35,48,.35)}
.msg.amb{align-self:flex-start;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.q-big{font-size:19px;line-height:1.4;font-weight:600;text-wrap:balance}
.fact{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.fact:last-child{border-bottom:0}
.fact .x{margin-left:auto;border:0;background:none;color:var(--dim);font-size:18px;line-height:1;padding:2px 4px;min-width:28px;min-height:28px}
.hyp{padding:11px 0;border-bottom:1px solid var(--line)}
.hyp:last-child{border-bottom:0}

/* pulse */
.big-num{font-family:var(--f-dot);font-weight:900;font-size:76px;line-height:.9;color:var(--bone);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.tile .v{font-family:var(--f-dot);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--ash);margin-top:6px}
.hbar{display:grid;grid-template-columns:86px 1fr 44px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .bar{height:8px}
.chart{width:100%;height:auto;display:block}
.chart text{font:10px var(--f-mono);fill:var(--ash)}

/* now playing */
.np{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:12px;background:rgba(0,0,0,.3);padding:calc(16px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom))}
.np[hidden]{display:none}
.np.drive{background:rgba(0,0,0,.55)}
body.np-open .app,body.np-open .dock{visibility:hidden}
.np-top{display:flex;align-items:center;gap:10px}
.np-title{font-size:13px;color:var(--ash);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-time{font-family:var(--f-mono);font-size:12px;color:var(--ash)}
.np-tap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px;border-radius:18px;overflow:auto}
.np-cap{font-size:clamp(22px,6.6vw,34px);line-height:1.3;font-weight:620;text-wrap:balance;max-width:24ch}
.np-heard{font-size:17px;color:#f0a2a8;font-style:italic;min-height:1em}
.np-prompt{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);min-height:1em}
.np-prompt.live{animation:pulse-t 1.1s ease-in-out infinite}
@keyframes pulse-t{50%{opacity:.35}}
.np-level{height:6px;max-width:260px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.np-level i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d0c15,#ff5866);transition:width .08s}
.np-grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.np-grade[hidden]{display:none}
.np-grade button{height:78px;border-radius:18px;font:700 18px var(--f-body);border:1px solid var(--line-2);background:rgba(255,255,255,.05)}
.np-grade button[data-g="1"]{background:linear-gradient(180deg,#a61a27,#650b14);border-color:#c42330}
.np-ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.np-ctl button{height:74px;border-radius:18px;border:1px solid var(--line-2);background:rgba(20,8,10,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.np-ctl button span{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--bone);opacity:.8}
.np-ctl button.end{border-color:#c42330;background:rgba(122,14,24,.28)}
.np-min{display:flex;align-items:center;gap:4px;height:34px;padding:0 12px 0 8px;border-radius:17px;border:1px solid var(--line-2);background:rgba(20,8,10,.6);font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--bone)}
.np-min svg{width:18px;height:18px;fill:none;stroke:var(--bone);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.np-mini{position:fixed;left:12px;right:12px;bottom:calc(94px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:8px;padding:8px;border-radius:20px;border:1px solid #c42330;background:rgba(40,8,13,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.np-mini[hidden]{display:none}
.mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 8px;background:none;border:0;text-align:left;color:var(--bone)}
.mini-t{display:flex;flex-direction:column;min-width:0}.mini-t b{font-size:14px}.mini-t small{font-size:11px;color:var(--ash)}
.mini-dot{width:10px;height:10px;border-radius:50%;background:#ff4654;box-shadow:0 0 12px #ff4654;animation:pulse-t 1.1s ease-in-out infinite;flex:none}
.mini-btn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line-2);background:rgba(20,8,10,.6);display:grid;place-items:center}
.mini-btn.end{border-color:#c42330}
.mini-btn svg{width:22px;height:22px;fill:none;stroke:var(--bone);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.np-ctl button.main{background:linear-gradient(180deg,#a61a27,#650b14);border-color:#c42330}
.np-ctl svg{width:26px;height:26px;fill:none;stroke:var(--bone);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.np-prog{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.np-prog i{display:block;height:100%;background:var(--ember);width:0;transition:width .4s}

/* sheet, toast, modal */
.sheet-wrap{position:fixed;inset:0;z-index:25;display:flex;justify-content:center;align-items:stretch;background:rgba(0,0,0,.55);padding:calc(38px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom))}
.sheet-wrap[hidden]{display:none}
.sheet{max-width:560px;animation:rise .28s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;z-index:40;top:calc(38px + env(safe-area-inset-top));right:10px;width:min(340px,calc(100% - 20px));padding:11px 13px;border-radius:13px;background:rgba(28,12,15,.85);border:1px solid var(--line-2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 14px 40px rgba(0,0,0,.6);font-size:13.5px;animation:rise .25s}
.toast[hidden]{display:none}
.toast b{display:block;font-size:12px;letter-spacing:.04em;margin-bottom:2px}
.copybox{font:12px/1.4 var(--f-mono);min-height:160px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

{id:'os',n:1,track:'MIND',dom:'mind',title:'The Operating System',sum:'How the mind really decides: two systems, anchors, loss aversion.',
script:[
"Before you can read anyone, Joe, you need to know the machine you're reading. Daniel Kahneman split the mind into two systems. System One is fast, automatic and emotional. It has already decided whether it likes you before you've finished the handshake. System Two is slow, effortful and lazy. Mostly, it signs off whatever System One hands it. Almost all persuasion is aimed at System One.",
"Here's the one to remember. Anchoring. In a famous experiment, people spun a wheel rigged to stop on ten or sixty-five, then guessed what percentage of African countries were in the United Nations. The ten group guessed around twenty-five. The sixty-five group guessed around forty-five. A meaningless number moved their judgement.",
"Now add loss aversion. Losses hit roughly twice as hard as equal gains. People fight harder to avoid losing a thousand pounds than to win one. And the availability heuristic: whatever comes to mind easily feels more likely.",
"So. The first number spoken in a room shapes every number after it. The fear of losing a deal moves people more than the hope of winning one. And a vivid story beats a spreadsheet. You're not dealing with rational buyers. Neither, I'm afraid, are they."],
concepts:[['System 1 / System 2','Fast emotional autopilot versus slow, lazy reasoning that mostly rubber-stamps it.'],['Anchoring','The first number heard pulls every later estimate towards it.'],['Loss aversion','Losses feel about twice as strong as equal gains.'],['Availability','Easy-to-recall examples feel more likely and more important.']],
deal:"Put your number on the table first when you can justify it. The anchor sets the range. Frame terms around what they lose by walking away, not what they gain by signing.",
drill:"In your next negotiation, note who says the first number and how far the final figure lands from it.",
vids:[['CjVQJdIrDJ0','Thinking, Fast and Slow','Daniel Kahneman · Talks at Google','Lecture'],['HefjkqKCVpo','Anchoring','Daniel Kahneman','Short'],['wEwGBIr_RIw','12 Cognitive Biases Explained','Animated explainer','Explainer'],['NNnIGh9g6fA','Human Behavioral Biology: Introduction','Robert Sapolsky · Stanford','Deep lecture']],
find:['anchoring bias negotiation','loss aversion explained','system 1 system 2 examples'],
cards:[["In the spinning-wheel experiment, what did a random number do to people's estimates?","It anchored them. A high random number produced higher estimates and a low one produced lower estimates.",["anchor","higher|high","number"]],["Roughly how much harder do losses hit than equal gains?","About twice as hard. That's loss aversion.",["twice|two|2|double"]],["Which of Kahneman's two systems does most persuasion target, and why?","System One, the fast emotional one, because System Two is lazy and usually rubber-stamps it.",["one|1|fast","emotion|automatic|intuit"]]]},

{id:'inner',n:2,track:'MIND',dom:'self',title:'The Inner Game',sum:'Your own emotions under pressure: name them, reframe them, breathe, plan.',
script:[
"Everything I've taught you about reading other people applies to you first, Joe. The person most likely to lose you a deal is the one in your seat. When a buyer pushes on price, your body reacts before you choose to. Heat in the face, a rush to fill the silence, a discount you didn't need to give.",
"Lisa Feldman Barrett's research says emotions aren't fixed reflexes that happen to you. Your brain builds them from body signals and context, which means you have more say than it feels like. So, three tools. First, name it. Matthew Lieberman's brain-scanning studies found that putting a feeling into words, even one word, quietens the brain's threat response. Irritated. Rushed. Small. Say it silently and you're already back in the driving seat.",
"Second, reframe it. James Gross's work shows that changing what a situation means changes the emotion, and works better over time than gritting your teeth and suppressing it. The buyer isn't insulting you. He's negotiating, which means he's interested. Third, use your body. The physiological sigh: two inhales through the nose, one long exhale through the mouth. A 2023 Stanford study found five minutes a day of this kind of breathing lifted mood more than mindfulness meditation did.",
"Then plan it. Peter Gollwitzer's if-then plans, if this happens then I'll do that, make people noticeably more likely to follow through. If a buyer says the rent's too high, then I breathe and mirror. Ethan Kross adds one more: talk to yourself by name. Joe, what's the play here? Distance turns panic into a problem to solve. I'll be watching for the moments that get under your skin. When they repeat, I'll tell you."],
concepts:[['Name it','Affect labelling: one word for the feeling quietens the threat response.'],['Reframe it','Change what it means and the feeling changes.'],['Breathe it','Physiological sigh: two in through the nose, one long out.'],['Plan it','If-then plans for your known triggers.'],['Distance it','Talk to yourself by name.']],
deal:"Before you name a price or take a call you're dreading, do two physiological sighs. When the pushback lands, name your feeling silently, then mirror theirs out loud.",
drill:"Pick the one moment in a deal that winds you up most. Make an if-then plan for it, and use it the next time it happens.",
vids:[['0gks6ceq4eQ',"You Aren't at the Mercy of Your Emotions",'Lisa Feldman Barrett · TED','Talk'],['0P7TLLewnrs','The Power of Naming Your Emotions','Affect labelling explainer','Short'],['iOi1OJWh-pI','The Fastest Way to Reduce Stress in Real Time','Andrew Huberman','Short'],['xb0nLpdWttA','How to Harness Your Inner Voice','Ethan Kross · TED','Talk'],['GTAPSwR3tWE','Overgeneralization: The Thinking Error','Dr David Burns','Explainer']],
find:['affect labeling research','cognitive reappraisal vs suppression','implementation intentions if then plans'],
cards:[["What is affect labelling, and why does it work?","Naming a feeling in words, even one word. It quietens the brain's threat response so you think more clearly.",["name|label|word","calm|quiet|threat|amygdala|reduce"]],["Describe the physiological sigh.","Two inhales through the nose, then one long exhale through the mouth.",["two|double","inhale|breath|in","exhale|out"]],["Turn this into an if-then plan: you get defensive when buyers question the price.","If a buyer questions the price, then I breathe, mirror their words and stay silent.",["if","then","breath|mirror|label|pause|silent"]]]},

{id:'body',n:2,track:'READ',dom:'read',title:'The Body Speaks',sum:'Navarro\'s FBI method: comfort, discomfort, feet, pacifiers, baselines.',
script:[
"Joe Navarro spent twenty-five years in the FBI reading people who were lying to him. His first rule isn't a gesture. It's comfort and discomfort. The limbic brain reacts before the thinking brain gets a vote. Freeze, flight, fight. Freeze shows as sudden stillness and held breath. Flight shows as leaning away, blocking, and turning the feet towards the door.",
"The feet are the most honest part of the body, because nobody has trained them to lie. When someone turns their feet away mid-conversation, they want to leave, whatever their face is saying.",
"Watch for pacifying. Touching the neck, rubbing the thighs, stroking the face. That's the body calming itself after stress.",
"And the golden rule. Baseline first. One crossed arm means nothing. A change from how that person normally sits, right after you say a specific thing, means a great deal. Clusters, not single signals. Changes, not poses.",
"Oh, and the claim that ninety-three percent of communication is non-verbal? It's a misreading of Albert Mehrabian's studies, which were about feelings and attitudes when words and tone clash. Don't repeat it in front of anyone clever."],
concepts:[['Comfort / discomfort','The master read. Everything else is detail.'],['Freeze, flight, fight','Limbic reactions that leak before thought catches up.'],['Feet don\'t lie','Feet point where people want to go.'],['Pacifiers','Neck, face and thigh touching to self-soothe after stress.'],['Baseline + clusters','Read changes from normal, in groups, tied to a moment.']],
deal:"At a viewing, watch the feet when you mention rent, rates or lease length. Feet swinging to the exit is an objection they haven't said yet. Label it before they leave the building.",
drill:"On your next viewing, spend the first two minutes baselining the client: stance, hands, how much they talk. Then watch what changes when the rent comes up.",
vids:[['4jwUXV4QaTw','How to Read Body Language','Joe Navarro · WIRED Tradecraft','Breakdown'],['aThjX4rsnfk','Universal Body Language','Joe Navarro · WIRED','Breakdown'],['f9SA25OukyM','Body Language Questions Answered','Joe Navarro · WIRED','Q&A'],['cef35Fk7YD8','You Are Contagious','Vanessa Van Edwards · TEDxLondon','Talk'],['zZ7cuQnXS30','"Stop Reading Body Language" (the 93% myth)','Chase Hughes','Interview']],
find:['Joe Navarro pacifying behaviors','body language baseline cluster','reading body language in sales meetings'],
cards:[["According to Navarro, which part of the body is most honest, and why?","The feet, because we rarely think to control them.",["feet|foot"]],["Why is a single gesture, like crossed arms, unreliable on its own?","You need a baseline and a cluster. Read changes from someone's normal behaviour, in groups of signals, tied to a moment.",["baseline|normal","cluster|group|several","change"]],["What is a pacifying behaviour? Give an example.","Self-soothing after stress, like touching the neck, rubbing the hands or thighs, or stroking the face.",["sooth|calm|stress","neck|rub|face|touch"]]]},

{id:'face',n:3,track:'READ',dom:'read',title:'The Face Leaks',sum:'Ekman\'s universal expressions, micro-expressions, contempt, real smiles.',
script:[
"Paul Ekman travelled to Papua New Guinea in the nineteen-sixties and found that some facial expressions look the same everywhere. Seven of them: happiness, sadness, fear, anger, surprise, disgust and contempt. When someone tries to hide one, it can leak out as a micro-expression, a flash lasting a fraction of a second before the mask comes back.",
"Two to learn first. Contempt is the only one-sided expression. One corner of the mouth tightens and lifts. It means: I'm above you, or above this. If a buyer flashes contempt at your number, the number is the problem.",
"Second, the real smile. A genuine smile, the Duchenne smile, reaches the eyes. The cheeks lift and crow's feet appear. A polite smile stays in the mouth. Navarro adds the lips. When people disagree or hold something back, the lips compress and disappear.",
"Now the honest bit. A micro-expression tells you an emotion was felt. It doesn't tell you why. Fear on a face might be fear of being caught, or fear of not being believed. Read the emotion. Then ask about it."],
concepts:[['Seven universals','Happiness, sadness, fear, anger, surprise, disgust, contempt.'],['Micro-expression','A fraction-of-a-second leak of a hidden emotion.'],['Contempt','The only one-sided expression. Superiority.'],['Duchenne smile','Real smiles reach the eyes.'],['Lip compression','Lips vanish under stress or disagreement.']],
deal:"A contempt flash when you name the asking price means they think it's overpriced. Lips compressing as you list terms means a condition they'll fight. Deal with it now, not at offer stage.",
drill:"In your next three client meetings, catch one genuine smile and one polite one. Note what you'd just said.",
vids:[['VAB9cUlGrRo','How to Read Facial Expressions','Joe Navarro · WIRED','Breakdown'],['lISfh-Ip-qA','Exploring Facial Expressions','Paul Ekman','Interview'],['EGjdMWQP8vY','What You Need to Know About Micro Expressions','Paul Ekman','Short'],['G5wpFFowPAo','The Contempt Micro Expression','Paul Ekman Group','Short']],
find:['micro expressions training examples','duchenne smile vs fake smile','contempt facial expression negotiation'],
cards:[["Which universal expression is one-sided, and what does it signal?","Contempt. One corner of the mouth tightens and lifts. It signals superiority or disdain.",["contempt","superior|disdain|above|look down"]],["How do you tell a genuine smile from a polite one?","A genuine Duchenne smile reaches the eyes: the cheeks lift and crow's feet appear.",["eye|crow|cheek|duchenne"]],["What can a micro-expression tell you, and what can't it?","It shows an emotion was felt, but not why. You still have to find the cause.",["emotion|feel","why|cause|reason"]]]},

{id:'persuade',n:4,track:'MOVE',dom:'persuade',title:'The Persuasion Code',sum:'Cialdini\'s seven levers and the moment before the ask.',
script:[
"Robert Cialdini spent years undercover in sales teams, fundraisers and car showrooms, and boiled down what worked. Reciprocity: give first, and people feel they owe you. Scarcity: people want more of what there's less of, and what they might lose. Authority: we defer to credible experts. Consistency: once someone commits to a small step, they want to stay consistent with it.",
"Liking: we say yes to people we like, people who are similar to us and who compliment us. Consensus, or social proof: when unsure, we copy what people like us did. And in 2016 he added a seventh. Unity. Shared identity. People like us do this.",
"Then came Pre-suasion. The moment before the message matters as much as the message. Whatever you get someone to focus on just before your ask becomes more important in their mind. Ask someone whether they see themselves as adventurous before you pitch the bold option, and they're more likely to take it.",
"Every lever here works on you too. Next time you feel a sudden urge to say yes, ask yourself which lever just got pulled."],
concepts:[['Reciprocity','Give first and people feel they owe you.'],['Scarcity','Less available, or about to be lost, means more wanted.'],['Authority · Consistency','Credible experts and small first commitments.'],['Liking · Consensus · Unity','Similarity, social proof, shared identity.'],['Pre-suasion','Control what they focus on just before the ask.']],
deal:"Real scarcity only. Inventing a rival offer is a banned practice for UK estate agents and can get you prohibited from working. Use the genuine kind: real interest, real deadlines, the last unit of its size.",
drill:"Before your next pitch, decide exactly what the client should be thinking about in the thirty seconds before you name the figure.",
vids:[['cFdCzN7RYbw','Science of Persuasion','Robert Cialdini · Influence at Work','Animated'],['GPVkuPT9WFI','Influence: Animated Summary','Book summary','Explainer'],['2SF5ekV3fmo','Pre-Suasion: Summary','Book summary','Explainer']],
find:['Cialdini principles in sales examples','pre-suasion techniques','social proof commercial property marketing'],
cards:[["Name Cialdini's seven principles of persuasion.","Reciprocity, scarcity, authority, consistency, liking, consensus or social proof, and unity.",["reciproc","scarc","author","consist|commit","lik","consensus|social proof","unity"]],["What is pre-suasion?","Shaping what someone focuses on right before your message, so they're receptive when it lands.",["before|prior","focus|attention|moment"]],["Why does a small first commitment make a bigger yes more likely?","Consistency. People want to act in line with what they've already said or done.",["consisten|commit"]]]},

{id:'price',n:5,track:'MOVE',dom:'persuade',title:'Price & Perception',sum:'Decoys, framing and why value lives in the mind.',
script:[
"Rory Sutherland, the Ogilvy ad man, likes to say that the opposite of a good idea can also be a good idea, and that value is created as much in the mind as in the product. People don't buy the thing. They buy how the thing feels.",
"Dan Ariely showed it with an old Economist subscription offer. Web only, fifty-nine dollars. Print only, a hundred and twenty-five. Print and web, also a hundred and twenty-five. Nobody wants print only. It's a decoy. But it makes print and web look like a steal, and most of his students chose it. Remove the decoy, and most switched to the cheap web-only option. Same choices, different context, different decision.",
"Add framing. Ninety percent let and ten percent vacant are the same building and very different feelings. Add the anchor from your first lesson, and you have the price toolkit. Present three options, not two. Lead with the high one. Make the one you want look like the obvious winner next to its neighbour.",
"One warning. Some of Ariely's other research has faced serious questions about its data. The decoy effect itself was first shown by other researchers and holds up in many settings. Treat him as a storyteller, not scripture."],
concepts:[['Decoy effect','A clearly worse option makes its neighbour look brilliant.'],['Framing','Same facts, different feeling.'],['Perceived value','People buy how it feels, not what it is.'],['Three-option pricing','Premium anchor, target, decoy.']],
deal:"When you present units or terms, give three: a premium option, the one you want them to take, and a weaker decoy that makes your target look obviously better.",
drill:"Rewrite one property description so the same facts feel different. Try 'ninety percent let' against 'one unit left'.",
vids:[['9X68dm92HVI','Are We in Control of Our Decisions?','Dan Ariely · TED','Talk'],['audakxABYUc','Life Lessons from an Ad Man','Rory Sutherland · TED','Talk'],['iueVZJVEmEs','Perspective Is Everything','Rory Sutherland · TEDxAthens','Talk']],
find:['decoy effect pricing examples','framing effect sales','Rory Sutherland alchemy reframing'],
cards:[["What is the decoy effect?","Adding an obviously worse option makes a similar, better option look far more attractive.",["decoy|worse|inferior","option|choice|attractive"]],["In Ariely's Economist example, what happened when the print-only option was removed?","Most people switched from print-and-web to the cheaper web-only option.",["web","cheap|switch|changed"]],["Why present three options instead of two?","The target option can be framed against a premium anchor and a weaker decoy, which steers the choice.",["anchor|premium|high","decoy|worse|compar"]]]},

{id:'negotiate',n:6,track:'MOVE',dom:'deal',title:'The Negotiator',sum:'Chris Voss: tactical empathy, mirrors, labels and the Ackerman model.',
script:[
"Chris Voss was the FBI's lead international kidnapping negotiator. His view: people aren't rational, so stop arguing logic and start using tactical empathy. Showing you understand how they feel, which isn't the same as agreeing.",
"Four tools. The mirror: repeat the last one to three words they said, as a question. Too high? Then shut up. They'll expand. The label: name their emotion. It seems like you're worried about being locked in. Never say I hear you. Let the silence after a label do the work.",
"The accusation audit: list every negative thing they might think about you before they say it. You probably think we're overpricing this. It takes the sting out. Calibrated questions: How am I supposed to do that? What about this doesn't work for you? They make the other side solve your problem.",
"Listen for 'that's right'. 'You're right' means they want you to stop talking. 'That's right' means they feel understood. That's the breakthrough. On price, his Ackerman model: plan offers at sixty-five, eighty-five, ninety-five and a hundred percent of your target, shrinking each step, and finish on a precise, non-round number. Precise numbers feel calculated, so they feel final."],
concepts:[['Tactical empathy','Show you understand the feeling without agreeing.'],['Mirror','Repeat the last 1–3 words, then go silent.'],['Label','"It seems like…" naming their emotion.'],['Accusation audit','Say their worst thoughts about you first.'],['Calibrated questions','"How" and "what" questions that hand them your problem.'],['Ackerman','65 / 85 / 95 / 100 percent, ending on a precise figure.']],
deal:"When a tenant says the rent's too high, don't defend the number. Mirror: 'Too high?' Then label: 'Sounds like you're worried about cash flow in year one.' Now you're negotiating the real problem.",
drill:"Use one mirror and one label on every call today. Count how often the other side keeps talking after a mirror.",
vids:[['QB9akDRbZGo','Learn the Best Negotiation Strategies','Chris Voss','Interview'],['ThQ8xPGg-QQ','Labeling Emotions Will Change Their Perception of You','Chris Voss','Short'],['q6lV87bZUfE','How to Win Negotiations with Tactical Empathy','Chris Voss','Interview']],
find:['Chris Voss mirroring labeling examples','accusation audit examples','Ackerman bargaining model explained'],
cards:[["What is a mirror, in Chris Voss's method?","Repeating the last one to three words they said, with an upward tone, then staying silent so they elaborate.",["repeat","last|word"]],["Why is 'that's right' better than 'you're right'?","'That's right' means they feel understood. 'You're right' is often a way to make you stop talking.",["understood|understand","stop|shut|end"]],["Describe the Ackerman offer sequence.","Offers at sixty-five, eighty-five, ninety-five and a hundred percent of your target, with shrinking steps, ending on a precise non-round number.",["65|sixty","85|eighty","95|ninety","precise|exact|round"]]]},

{id:'close',n:7,track:'MOVE',dom:'deal',title:'The Closer',sum:'SPIN, self-persuasion questions, the real objection, the three tens.',
script:[
"Neil Rackham's team studied more than thirty-five thousand sales calls and found something uncomfortable. In big sales, classic hard-closing techniques actually lowered success. What worked was questions.",
"SPIN. Situation questions get facts. Problem questions find difficulties. Implication questions make the cost of those difficulties grow. Need-payoff questions get the buyer to say the value out loud themselves. Implication is where top sellers separate. If your current unit can't take a second production line, what does that do to next year's growth plan? Now the problem is expensive, and you never had to say so.",
"Jeremy Miner pushes the same idea further: a calm, curious, slightly detached tone, and questions that let prospects persuade themselves. Alex Hormozi's point on stalls: there's usually one real concern hiding behind a polite excuse. Find it, then solve that one.",
"Jordan Belfort's straight line adds certainty. The buyer needs to be sure about the product, about you, and about your company. Certainty is transferred, not argued. A note on Belfort: he went to prison for securities fraud. Learn the mechanics. Leave the ethics in the nineties."],
concepts:[['SPIN','Situation, Problem, Implication, Need-payoff.'],['Implication questions','Make the cost of doing nothing grow in their head.'],['Self-persuasion','They believe what they say, not what you say.'],['The real objection','A polite stall hides one true concern.'],['Three tens','Certainty in product, salesperson, company.']],
deal:"Before any pitch, write three implication questions about what staying in their current premises is costing them. Ask them, then let the client tell you why they need to move.",
drill:"On your next call, ask at least two implication questions before you mention a single property feature.",
vids:[['TSUeakjHYCE','The Origins of SPIN Selling','Neil Rackham','Interview'],['KCu1EyMxHcE','4 Sales Questions So Good Prospects Close Themselves','Jeremy Miner','Training'],['CwmV4azspI8','Close Any Sale in 3 Steps','Alex Hormozi','Training'],['4_AbyMhml4k','An Introduction to the Straight Line','Jordan Belfort','Training']],
find:['SPIN selling implication questions examples','NEPQ consequence questions','handling objections commercial property'],
cards:[["What does SPIN stand for?","Situation, Problem, Implication and Need-payoff questions.",["situation","problem","implication","need"]],["Which SPIN question type most separates top performers, and what does it do?","Implication questions. They make the cost of the buyer's problem bigger and more urgent in the buyer's own mind.",["implication","cost|bigger|urgent|worse"]],["What are Belfort's three tens?","Certainty about the product, about you the salesperson, and about the company.",["product","you|salesperson|person|seller","company|firm"]]]},

{id:'lies',n:8,track:'DEEP',dom:'read',title:'Lies & Interrogation',sum:'Why nobody can spot liars, and what actually works.',
script:[
"The brutal fact first. Across hundreds of studies, people detect lies at about fifty-four percent. Barely better than a coin. There's no Pinocchio's nose. No single tell means lying.",
"Pamela Meyer looks for clusters and mismatches. Words that say yes while the head shakes no. Over-formal denials: I did not take that money, rather than I didn't take it. Too much irrelevant detail, or a story told in suspiciously perfect order.",
"Aldert Vrij's research gives you the better tool. Cognitive load. Lying is harder work than telling the truth. So make thinking harder. Ask for the story backwards. Ask an unexpected question. Liars tend to crack more than truth-tellers.",
"Then Saul Kassin's warning. Pressure interrogations that assume guilt, like the American Reid technique, produce false confessions from innocent people. The UK moved to the PEACE model in the nineties: open, information-gathering interviews instead of accusation. Better information, fewer false confessions. Your lesson: you don't catch lies by staring at eyes. You catch them by asking good open questions, then checking the story against facts."],
concepts:[['The 54% problem','Humans are near chance at spotting lies.'],['Clusters & mismatches','Words and body disagreeing, formal denials.'],['Cognitive load','Make thinking harder; liars struggle more.'],['Reverse order','Ask for the story backwards.'],['PEACE vs Reid','Open interviewing beats accusation.']],
deal:"When a buyer's 'budget' story doesn't add up, don't accuse. Ask for it in a different order: 'Walk me back from board sign-off to where the figure came from.' Inconsistencies surface on their own.",
drill:"Next time a story feels off, ask one unexpected question and one request to tell it backwards. Note how the fluency changes.",
vids:[['P_6vDLq64gE','How to Spot a Liar','Pamela Meyer · TED','Talk'],['JDRRwFfJKkw','False Confessions','Saul Kassin','Lecture'],['Ou0SNbP5d7Q','What Does Science Tell Us About False Confessions?','Saul Kassin','Short'],['3mM-C0jz3co','How to Influence Anyone & Read People','Chase Hughes','Interview']],
find:['Aldert Vrij cognitive load lie detection','PEACE model investigative interviewing','deception detection research'],
cards:[["How accurate are people at detecting lies, on average?","About fifty-four percent, barely better than chance.",["54|fifty|chance|coin|half"]],["What is the cognitive load approach to lie detection?","Make thinking harder, for example by asking for the story backwards, because lying already uses more mental effort.",["hard|load|effort","backward|reverse|unexpected"]],["What's the difference between the Reid technique and the UK's PEACE model?","Reid is accusatory and assumes guilt. PEACE is open, information-gathering interviewing, and produces fewer false confessions.",["accus|guilt|pressure","open|information|gather"]]]},

{id:'covert',n:9,track:'DEEP',dom:'persuade',title:'Covert Influence',sum:'Priming, showmanship and feeding the need that drives someone.',
script:[
"Derren Brown built a career on looking like he could plant ideas in people's heads. In one famous piece, two advertising creatives design a poster that matches his sealed prediction almost exactly, apparently because he seeded the images along their taxi route. He's open that his shows mix psychology, suggestion, misdirection and showmanship.",
"So the lesson isn't that subliminal control works. The evidence for it is weak. The lesson is that context primes behaviour. What people see and hear just before they decide nudges what they decide.",
"Chase Hughes, a former Navy chief who trains intelligence and law enforcement, comes at it from behaviour profiling. Watch what people need: significance, acceptance, approval, intelligence, pity, power. Find which need drives someone and you know what they're hungry to hear. Someone who needs to look intelligent will choose the option that makes them look clever. Someone who needs approval will choose what their boss will praise.",
"Covert influence is mostly this. Shape the environment. Feed the need. Let them think it was their idea."],
concepts:[['Priming','What comes just before a decision shapes it.'],['Showmanship vs science','Brown blends technique with theatre.'],['Social needs','Significance, acceptance, approval, intelligence, pity, power.'],['Their idea','People defend decisions they think they made.']],
deal:"Profile the decision-maker's need before the meeting. Intelligence-driven? Give them data to discover for themselves. Approval-driven? Show them how their board will see the deal.",
drill:"For your next three clients, guess their dominant social need from the first five minutes. Test it by feeding it.",
vids:[['43Mw-f6vIbo','Tricking Advertisers with Adverts','Derren Brown','Demonstration'],['L2E7OBWPG5I','Brainwashes an Entire Shopping Mall','Derren Brown','Demonstration'],['RvjR9GM2kX8','Instantly Read Any Room','Chase Hughes · Diary of a CEO','Interview'],['vXYqy0hSYn8','Mind Control','Chase Hughes · The Behavior Panel','Interview']],
find:['Chase Hughes social needs profiling','priming effect marketing','Derren Brown suggestion explained'],
cards:[["Name Chase Hughes's six social needs.","Significance, acceptance, approval, intelligence, pity, and power or strength.",["signific","accept","approv","intellig","pity","power|strength"]],["Does Derren Brown's work prove that subliminal messages control people?","No. He mixes psychology with suggestion, misdirection and showmanship. The real lesson is that context primes behaviour.",["no|not","show|misdirect|prim|context"]],["What's the core move of covert influence in sales?","Shape the context, feed their dominant need, and let them believe the decision was their own idea.",["context|environment","need","own idea|their idea|their decision|think it"]]]},

{id:'triad',n:10,track:'DARK',dom:'dark',title:'The Dark Triad',sum:'Narcissism, Machiavellianism, psychopathy, and how to deal with them.',
script:[
"In 2002, Delroy Paulhus and Kevin Williams grouped three overlapping traits and called them the dark triad. Narcissism: grandiosity, entitlement, a hunger for admiration. Machiavellianism: cold strategy, manipulation, a long game, a cynical view of people. Psychopathy: impulsivity, thrill-seeking, shallow emotion and little remorse. Some researchers add a fourth, everyday sadism, and call it the dark tetrad.",
"These are traits on a scale, not boxes. Everyone has some. Clinical psychopathy, measured with Robert Hare's checklist, is thought to affect around one percent of people, and some studies find more of it in senior corporate roles. Jon Ronson's warning is the useful one: once you learn the checklist, you'll start seeing psychopaths everywhere, and that itself is a kind of madness.",
"Spotting high scorers at work: charm that arrives too fast. Stories where they're always the hero. Rules for everyone else. Flattery upward, contempt downward.",
"Handling them: never show them what you want most. Keep everything in writing. Don't try to out-manipulate them. Out-document them."],
concepts:[['Narcissism','Grandiosity, entitlement, need for admiration.'],['Machiavellianism','Cold strategy and a long manipulative game.'],['Psychopathy','Impulsive, shallow emotion, little remorse.'],['Dark tetrad','Adds everyday sadism.'],['Traits, not labels','Everyone scores somewhere on each.']],
deal:"High-Mach buyers negotiate to win, not to agree. Expect strategic lies and late re-trades. Put every concession in writing the same day and pin timelines in the heads of terms.",
drill:"Think of the hardest negotiator you've dealt with. Score them privately on the three traits. What did they want you to feel?",
vids:[['gNEqnzUjyxE','The Dark Triad Explained','Explainer','Explainer'],['tmKQAhW1Jcc','Machiavellianism vs Psychopathy vs Narcissism','Lecture clip','Lecture'],['xYemnKEKx0c','Strange Answers to the Psychopath Test','Jon Ronson · TED','Talk'],['HKHio6iWxqE','The Dark Tetrad','Dr Fiona Girkin','Interview']],
find:['corporate psychopath signs','Machiavellianism in negotiation','dealing with narcissists at work'],
cards:[["Name the three dark triad traits.","Narcissism, Machiavellianism and psychopathy.",["narciss","machiavel|mach","psychopath"]],["What does the dark tetrad add?","Everyday sadism: taking pleasure in other people's discomfort.",["sadis"]],["What's the best defence against a high-Machiavellian negotiator?","Don't reveal what you want most, keep everything in writing, and out-document rather than out-manipulate them.",["writing|document|record","reveal|show|want"]]]},

{id:'manip',n:11,track:'DARK',dom:'dark',title:'The Manipulation Playbook',sum:'Gaslighting, love bombing, DARVO, triangulation: see them coming.',
script:[
"Knowing these isn't about using them. It's about seeing them coming, especially from the people across the table. Gaslighting, named after the 1938 play Gas Light, makes you doubt your own memory. That never happened. You're overreacting.",
"Love bombing floods you with attention and praise early to create dependence, then withdraws it. Intermittent reinforcement, rewards that arrive unpredictably, is the most habit-forming pattern in behavioural psychology. That's why hot-and-cold people are so hard to walk away from.",
"DARVO, a term from the psychologist Jennifer Freyd: Deny, Attack, Reverse Victim and Offender. You raise a problem, and somehow you end up apologising. Triangulation: bringing in a third party, real or invented, to create competition and insecurity. In business it sounds like: the other agent says they can do it cheaper.",
"Dr Ramani Durvasula's rule for dealing with it: don't defend, don't engage, don't explain, don't take it personally. And the antidote isn't cynicism. It's knowing your own mind well enough to notice when someone is trying to edit it."],
concepts:[['Gaslighting','Making you doubt your own memory.'],['Love bombing','Early flood of attention to build dependence.'],['Intermittent reinforcement','Unpredictable rewards hook hardest.'],['DARVO','Deny, Attack, Reverse Victim and Offender.'],['Triangulation','A third party used to create competition.']],
deal:"When a client says the other agent will do it cheaper, that's triangulation. Don't drop your fee on reflex. Ask: 'What would they have to do for you to choose them over us?'",
drill:"This week, spot one example of DARVO or triangulation at work, on TV or in a deal. Log it in Field.",
vids:[['lLsH2NJD1Vo','How to Spot a Gaslighter','Dr Ramani Durvasula','Explainer'],['FISZshe9L3s','Hidden Signs Someone Is Gaslighting','Dr Ramani · MedCircle','Interview'],['WF-ZevEXVu8','How to Handle the DARVO Method','Explainer','Explainer'],['-DqnjoVfRJo','How to Become Manipulation Resistant','Rick Hanson','Conversation']],
find:['manipulation tactics in negotiation','triangulation tactic business','DARVO explained'],
cards:[["What does DARVO stand for?","Deny, Attack, Reverse Victim and Offender.",["deny","attack","reverse"]],["Why are hot-and-cold people so hard to walk away from?","Intermittent reinforcement. Unpredictable rewards are the most habit-forming pattern there is.",["intermittent|unpredict|random","reward|reinforce"]],["What is triangulation, and how does it show up in a deal?","Bringing in a third party to create competition and insecurity, like 'the other agent says they'll do it cheaper.'",["third|other","competi|insecur|cheaper"]]]},

{id:'crowd',n:12,track:'DARK',dom:'power',title:'Obedience & the Crowd',sum:'Milgram, Asch, Zimbardo: authority, conformity and the lone dissenter.',
script:[
"In 1961 at Yale, Stanley Milgram told volunteers they were helping with a study on learning, and had them give what they believed were increasingly painful electric shocks to a man in another room. The shocks were fake. The man was an actor. In the best-known version, sixty-five percent went all the way to the maximum, four hundred and fifty volts, because a man in a grey lab coat said the experiment requires that you continue.",
"A decade earlier, Solomon Asch showed people lines of obviously different lengths. When everyone else in the room gave the wrong answer, about three quarters of participants went along with the group at least once. A single ally who broke from the group cut conformity dramatically.",
"Then Zimbardo's Stanford prison experiment, which you'll hear about everywhere. Be careful with it. Later investigations showed the guards were encouraged to be harsh, so it's closer to theatre than science. Milgram and Asch, by contrast, have been partly replicated.",
"Your takeaways. Authority is a costume: titles, uniforms, a confident tone. Groups bend what people see. And one dissenting voice gives everyone else permission to think."],
concepts:[['Obedience','Ordinary people follow authority past their own limits.'],['Conformity','Groups bend what people report seeing.'],['The lone dissenter','One ally breaks the spell.'],['Read studies critically','Stanford prison is closer to theatre.']],
deal:"In a group viewing, find the person everyone glances at before they speak. That's the real authority, whatever the job titles say. Win them and the room follows. If one person objects, deal with it fast: one dissenter gives the rest permission.",
drill:"At your next meeting with more than two people, note who looks at whom before answering. Map the real hierarchy.",
vids:[['xOYLCy5PVgM','Milgram Experiment: Original Footage','Archive clip','Footage'],['8bbVFeTIIg8','The Milgram Experiment (Short Documentary)','Plainly Difficult','Documentary'],['iRh5qy09nNw','The Asch Experiment','Archive','Footage'],['OsFEV35tWsg','The Psychology of Evil','Philip Zimbardo · TED','Talk']],
find:['Milgram variations obedience rates','Asch conformity one ally','Stanford prison experiment criticism'],
cards:[["In Milgram's best-known version, what share went to the maximum 450 volts?","About sixty-five percent.",["65|sixty|two thirds|two-thirds"]],["In Asch's experiments, what sharply reduced conformity?","A single ally who broke from the group.",["ally|one person|single|dissent|partner"]],["Why should you be careful citing the Stanford prison experiment?","Later evidence showed the guards were encouraged to be harsh, so it's closer to theatre than a clean experiment.",["encourag|coach|told|instruct|theatre|staged|flaw"]]]},

{id:'power',n:13,track:'DARK',dom:'power',title:'Power',sum:'Robert Greene\'s laws that matter at the table, and character under stress.',
script:[
"Robert Greene's 48 Laws of Power reads like a manual for courtiers, and plenty of people treat it as a villain's handbook. Greene says it's descriptive: this is how power has worked, so you can see it working on you.",
"A few laws that matter in sales. Law four: always say less than necessary. The more you talk, the more common you seem and the more likely you'll say something foolish. Silence makes people fill the gap, often with concessions. Law sixteen: use absence to increase respect. Be too available and your value drops.",
"Law eight: make other people come to you. Whoever travels to the other side is usually the weaker party. Law one: never outshine the master. Make the people above you look brilliant.",
"In The Laws of Human Nature, Greene goes deeper. Everyone wears a mask. Study character, which shows under stress, over time, and in small things. And the most dangerous person to be naive about is yourself. Your own envy, grandiosity and defensiveness are the levers other people will pull."],
concepts:[['Law 4','Always say less than necessary.'],['Law 16','Use absence to increase respect.'],['Law 8','Make other people come to you.'],['Law 1','Never outshine the master.'],['Character','Revealed under stress, over time, in small things.']],
deal:"After you state a price, stop talking. Count to seven in your head. Let them fill the silence.",
drill:"In your next negotiation, after every key number, say nothing for at least five seconds.",
vids:[['SJE3w04zdwk','The 48 Laws of Power','Robert Greene · Between the Lines','Interview'],['Hn7IqPTaZes','48 Laws of Power: The Narcissist\'s Bible?','Robert Greene','Interview'],['aVYvkoHJWCk','The Laws of Human Nature','Robert Greene','Podcast']],
find:['48 laws of power in business negotiation','Robert Greene laws of human nature character','power of silence in sales'],
cards:[["What is Greene's law four, and why does it work in negotiation?","Always say less than necessary. Silence makes the other side fill the gap, often with information or concessions.",["less|silence|quiet|say less","fill|concession|information"]],["What does 'use absence to increase respect' mean in sales?","Don't be endlessly available. Scarcity of your time raises your perceived value.",["available|absence|scarc","value|respect"]],["According to Greene, where does someone's true character show?","Under stress, over time, and in small behaviours.",["stress|pressure","small|time"]]]},

{id:'mass',n:14,track:'DARK',dom:'power',title:'Mass Mind Control',sum:'Propaganda, cults and the memory you can\'t trust.',
script:[
"Now scale it up. Edward Bernays, Sigmund Freud's nephew, turned his uncle's ideas about the unconscious into a business. In 1929 he had young women march down Fifth Avenue smoking 'torches of freedom', turning cigarettes into a symbol of women's liberation, for a tobacco client. He called the practice the engineering of consent, and openly wrote a book called Propaganda.",
"Then cults. Steven Hassan, a former member of the Moonies, built the BITE model of how high-control groups work: control of Behaviour, Information, Thought and Emotion. Control enough of those four and you can reshape someone's identity.",
"Under all of it sits memory. Elizabeth Loftus showed people a film of a car crash. Asked how fast the cars were going when they smashed, people estimated higher speeds than when asked about cars that hit, and a week later more of them remembered broken glass that was never there. In another study she planted whole false childhood memories, like being lost in a shopping centre, in about a quarter of people.",
"Memory isn't a recording. It's a story rebuilt every time you tell it, and other people can edit it. Which brings us back to you, Joe. What have you been told so many times that you now remember it as your own?"],
concepts:[['Engineering of consent','Bernays: shaping public desire on purpose.'],['BITE model','Behaviour, Information, Thought, Emotion control.'],['Reconstructive memory','Every recall is a rewrite.'],['Leading questions','Word choice edits what people remember.']],
deal:"Your questions shape what clients remember. After a viewing, ask 'What stood out about the space?' rather than 'Any concerns?' You're shaping the memory they take back to their board.",
drill:"Ask two clients about the same viewing, one with a positive-loaded question and one neutral. Compare what they recall.",
vids:[['gP-tuAT9_3k','The BITE Model Explained','Steven Hassan','Interview'],['5dtg-qFPYDE','"Public relations" is a polite term for propaganda','Edward Bernays · Century of the Self clip','Archive'],['eDu5999DFLM','The Man Who Created Propaganda','Edward Bernays explainer','Documentary'],['PB2OegI6wvI','How Reliable Is Your Memory?','Elizabeth Loftus · TED','Talk']],
find:['Edward Bernays torches of freedom','BITE model cult control','Loftus misinformation effect'],
cards:[["What does Steven Hassan's BITE model stand for?","Control of Behaviour, Information, Thought and Emotion.",["behav","inform","thought","emotion"]],["In Loftus's car crash study, what did the word 'smashed' do?","It raised speed estimates, and later made people more likely to falsely remember broken glass.",["speed|faster|higher|fast","glass|memor|remember"]],["What did Bernays call his method of shaping public opinion?","The engineering of consent.",["engineer","consent"]]]}

{id:'dissonance',name:'Cognitive dissonance',what:"When what you do clashes with what you believe, the discomfort pushes you to change the belief, not the behaviour. It's why people defend bad decisions.",ex:"Find one decision you keep defending. Ask: would I make it again today, knowing what I know?",k:['clash','belief','behaviour']},

        if(h.wav){try{r=await absorbAudio(seg.q,h.wav);chk();NP.heard(r.heard)}catch(e){if(e==='stop')throw e;handleAIErr(e);NP.prompt('');await say("I couldn't make that out. I'll ask again later.");break}
          if(!r.heard&&r.command==='none'){NP.prompt('');await say("I didn't catch that.");break}}
        else{const cmd=command(h.text);if(cmd!=='none'&&cmd!=='dont_know')r={command:cmd};else{const x=await absorbText(seg.q,h.text,'voice');chk();r={command:'none',say:x.say,followup:x.followup,teach:x.teach}}}
        NP.prompt('');
        if(r.command==='repeat')continue;if(r.command==='skip'){await say('Fine. Another time.');return}
        if(r.command==='stop'){await say('Stopping there.');this.on=false;this.tok++;throw 'stop'}
        if(r.command==='pause'){this.togglePause();await say('Paused. Tap to carry on.');while(this.paused){await sleep(200);chk()}continue}
        S.unans=S.unans.filter(u=>u.q!==seg.q);touch('s');
        await say(r.say||pick(ACKS));
        if(r.teach){NP.set('Teaching','');await say(r.teach)}
        if(r.followup&&(seg.d||0)<3)this.q.splice(this.i+1,0,iqSeg(r.followup,(seg.d||0)+1));return;
      }
      if(!S.unans.some(u=>u.q===seg.q))S.unans.push({id:uid(),q:seg.q,t:now()});if(S.unans.length>40)S.unans.shift();touch('s');
      await say(pick(["Think about it. Tell me when you've parked.","Hold that one. I'll be waiting.","We'll come back to that."]));
    }
  },
  async selfGrade(ms,chk){NP.grade(true);this.gradeVal=undefined;let left=ms;try{while(left>0&&this.gradeVal===undefined){await sleep(100);chk();if(!this.paused)left-=100}return this.gradeVal===undefined?null:this.gradeVal}finally{NP.grade(false)}},
  async refill(){
    const queued=new Set(this.q.slice(this.i).filter(s=>s.card).map(s=>s.card.id));const add=[];
    if(this.o.kind!=='interview')dueCards().filter(c=>cardOK(c)&&!queued.has(c.id)).slice(0,2).forEach(c=>{queued.add(c.id);add.push(qSeg(c))});
    if(AI()&&this.genN<80){try{const items=await genBatch(this.o.kind==='interview');this.genN++;
        items.forEach(it=>{if(it.type==='personal'||this.o.kind==='interview')add.push(iqSeg(String(it.q)));else{const c=addAiCard(it);if(c)add.push(qSeg(c))}})}
      catch(e){handleAIErr(e)}}
    if(add.length<3){if(this.o.kind!=='interview')weakestCards(8).filter(c=>cardOK(c)&&!queued.has(c.id)).slice(0,3).forEach(c=>add.push(qSeg(c)));const iq=interviewQs(1)[0];if(iq)add.push(iqSeg(iq))}
    this.q.push(...add);
  },
  tap(){ // returns true if the tap was used for listening
    if(this.awaitTap){this.awaitTap.res(true);return true}
    if(this.listening){Rec.stop();WebRec.stop();return true}
    return false;
  },
  skip(){this.tok++;Voice.stop();Rec.stop();WebRec.stop()},
  again(){this.replay=true;this.tok++;Voice.stop();Rec.stop();WebRec.stop()},
  end(){this.on=false;this.tok++;Voice.stop();Rec.stop();WebRec.stop()},
  togglePause(){this.paused=!this.paused;if(this.paused)Voice.pause();else Voice.resume();NP.paused(this.paused)},
  finish(){
    const mins=(now()-this.started)/60000;S.agg.mins+=mins;const d=ymd(now());S.agg.days[d]=(S.agg.days[d]||0)+mins;S.agg.sessions++;touch('s');
    this.on=false;this.awaitTap=null;NP.close();wake(false);Voice.keep(false);render();
    if(S.pending.length)toast('Ambrose',`${S.pending.length} answer${S.pending.length>1?'s are':' is'} waiting for your verdict in Debrief.`);
  }
};

function radar(){
  const vals=DOMS.map(([id])=>{const ms=MODULES.filter(m=>m.dom===id);return ms.reduce((a,m)=>a+mastery(m.id),0)/ms.length});
  const cx=150,cy=130,R=86,n=DOMS.length,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};let g='';
  [0.25,0.5,0.75,1].forEach(f=>{g+=`<polygon points="${DOMS.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="rgba(255,232,232,${f===1?0.16:0.07})"/>`});
  DOMS.forEach((_,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,232,232,.06)"/>`});
  g+=`<polygon points="${vals.map((v,i)=>pt(i,R*Math.max(0.04,v)).map(q=>q.toFixed(1)).join(',')).join(' ')}" fill="rgba(196,35,48,.28)" stroke="#c42330" stroke-width="1.5"/>`;
  vals.forEach((v,i)=>{const [x,y]=pt(i,R*Math.max(0.04,v));g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#efe8e7"/>`;const [lx,ly]=pt(i,R+22);g+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${DOMS[i][1]} ${Math.round(v*100)}</text>`});
  return `<svg class="chart" viewBox="0 0 300 262" role="img" aria-label="Mastery by domain">${g}</svg>`;
}
function forecast(){
  const ids=Object.keys(S.cards);if(!ids.length)return `<p class="small muted" style="margin-top:8px">Your forgetting curve appears after your first answers. It shows how much you'd still remember each day if you stopped now, and it flattens as reviews space out.</p>`;
  const v=[];for(let d=0;d<=14;d++){const t=now()+d*DAY;v.push(ids.reduce((a,id)=>a+ret(S.cards[id],t),0)/ids.length)}
  const W=300,H=130,l=30,r=12,tp=12,b=22,x=i=>l+i*(W-l-r)/14,y=q=>tp+(1-q)*(H-tp-b);
  let g='';[0,0.5,1].forEach(q=>{g+=`<line x1="${l}" x2="${W-r}" y1="${y(q)}" y2="${y(q)}" stroke="rgba(255,232,232,.07)"/><text x="${l-6}" y="${y(q)+3}" text-anchor="end">${q*100}%</text>`});
  const line=v.map((q,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(q).toFixed(1)).join(' ');
  g+=`<path d="${line} L${x(14)} ${y(0)} L${x(0)} ${y(0)} Z" fill="rgba(196,35,48,.18)"/><path d="${line}" fill="none" stroke="#c42330" stroke-width="1.8"/>`;
  g+=`<circle cx="${x(14)}" cy="${y(v[14]).toFixed(1)}" r="3.2" fill="#efe8e7"/><text x="${x(14)-6}" y="${(y(v[14])-8).toFixed(1)}" text-anchor="end" style="fill:#efe8e7">${Math.round(v[14]*100)}%</text>`;
  [[0,'Today'],[7,'+7 days'],[14,'+14 days']].forEach(([i,t])=>{g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===14?'end':'middle'}">${t}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted retention over 14 days">${g}</svg>`;
}
function bars(o,labels){return labels.map(([k,l])=>{const x=o[k];const p=x&&x.n?Math.round(100*x.sum/x.n):null;return `<div class="hbar"><span>${l}</span><div class="bar"><i style="width:${p||0}%"></i></div><span class="num small ${p==null?'muted':''}" style="text-align:right">${p==null?'—':p+'%'}</span></div>`}).join('')}
function insights(){
  const out=[],a=S.agg,p=o=>o&&o.n>=4?o.sum/o.n:null;
  const md=[['drive','in the car'],['walk','on foot'],['desk','at a desk']].map(([k,l])=>[l,p(a.mode[k])]).filter(x=>x[1]!=null).sort((x,y)=>y[1]-x[1]);
  if(md.length>=2)out.push(`You recall best ${md[0][0]} (${pct(md[0][1])}) and worst ${md[md.length-1][0]} (${pct(md[md.length-1][1])}).`);
  const td=['morning','afternoon','evening','night'].map(k=>[k,p(a.tod[k])]).filter(x=>x[1]!=null).sort((x,y)=>y[1]-x[1]);
  if(td.length>=2)out.push(`Your sharpest time is the ${td[0][0]} (${pct(td[0][1])}). Your weakest is the ${td[td.length-1][0]}.`);
  const sc=p(a.kind.scenario),rc=p(a.kind.recall);if(sc!=null&&rc!=null)out.push(sc>rc?`You do better applying ideas in scenarios (${pct(sc)}) than reciting them (${pct(rc)}). You learn by doing.`:`You recall ideas (${pct(rc)}) better than you apply them (${pct(sc)}). Ambrose will push more scenarios.`);
  const r1=recentAcc(10),r0=recentAcc(10,10);if(r1!=null&&r0!=null&&Math.abs(r1-r0)>=0.1)out.push(r1>r0?`You're climbing: last 10 answers ${pct(r1)}, up from ${pct(r0)}.`:`You're slipping: last 10 answers ${pct(r1)}, down from ${pct(r0)}. Shorter, more frequent sessions help.`);
  if(!out.length)out.push('Ambrose needs about twenty answers before he can say how you learn best. Keep going.');
  return out;
}
